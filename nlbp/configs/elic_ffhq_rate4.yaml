# NLBP, ELIC (Xu et al.'s rate-4 weights) on FFHQ 256 x 256, prior ffhq_10m, first decode, 8-bit storage.
# Parameters of the stored configuration of the reported run (nlbp/sampler.py names); steps = len(t0, t0 - stride, ..., 0).
codec: elic
codec_config: nlbp/configs/elic_ffhq_codec.yaml   # weights, PCA basis, gain, prior files, settings
rate: xu4
prior: ffhq_10m
storage: 8bit
variant: R1
target: yhat                 # v_ref
upsample: 1
prompt: empty
cfg: 1.0
t0: 250
stride: 1
min_bp: 375                  # steps with index >= min_bp use lambda2
lambda2: 0.28553655308261905           # early lambda_t
lambda1: 0.11411548012641985           # late lambda_t
kz: 0.3586486941060664                 # kappa
opt_K: 10                   # K
opt_lr: 0.0020533314624898266
snap: ddpm                    # priors/ddpm.snap_ddpm (nearest DDPM training index)
shift: 1.0

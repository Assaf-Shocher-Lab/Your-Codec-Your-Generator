# bmshj2018-hyperprior (CompressAI zoo, MSE), Kodak, 8-bit file chain. Decoder: target search, then the escalation
# ladder (stage 0 = corrected 8-bit write with lattice search and per-symbol hyper repair; stages 1-2; box step).
# k = net.M (192 for q1-q5, 320 for q6-q8).
codec: hyperprior
protocol: file_chain
dataset: kodak
rates: ["1", "2", "3", "4", "5", "6", "7"]
weights: compressai-zoo                # downloaded by CompressAI (TORCH_HOME/hub/checkpoints)
method: hp_adapted
pca: pca/pca_vimeo1000_f16.pt   # 16 x 16 patches, 1,000 Vimeo90K frames
gain: 10.0                              # c
settings:
  encoder: variant_a                    # round 1: Q(E(x)); rounds >= 2: Q(E'(x))
  search_start: proj
  search_steps: 400
  search_lr: 0.01
  margin_y: 0.06                        # m_y (8-bit)
  margin_z: 0.02                        # m_z
  refine_steps: 200
  refine_lr: 0.003
  refine_weight: 100.0
  pad_rows: 96
  pad_iters: 1000
  pad_lr: 0.002
  pad_cell_margin: 0.08
  chain_format: png8
  correction_budget: 30
  context_free_count: 1
  lattice_steps: 9056
  lattice_trials: 9056                  # trials per lattice call
  lattice_time_cap: 86000.0
  lattice_scan: 64
  lattice_group: 32
  # escalation ladder (escalation_write): stages 0-2 = (budget, hyper guard) per stage, stage 3 = box step
  ladder_stages: [[null, null], [60, null], [60, 0.10]]
  box_step: 1
  box_steps: 600
